schemaVersion: 1
id: INV-RWA-001
title: Persist financial and user mutations without HTTP 5xx or stale UI
statement: Payment, comment, bank account, and settings mutations in cypress-rwa must commit server state, return HTTP 2xx, and render updated data without console or uncaught page errors.
rationale: Prevents silent mutation loss, broken payment workflows, and server crashes on critical user transactions.
severity: P1
status: ACTIVE
owner: qa-platform
appliesTo:
  projects:
    - cypress-rwa
  pathGlobs:
    - backend/**
    - src/components/**
    - src/containers/**
  codeUnitKinds:
    - FILE
    - API_ENDPOINT
sourceRefs: []
supersedes: []
