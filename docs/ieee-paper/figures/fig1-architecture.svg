<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368">
  <defs>
    <style>
      text { font-family: Segoe UI, Arial, Helvetica, sans-serif; fill: #0F172A; }
      .title { font-size: 12px; font-weight: 700; }
      .subtitle { font-size: 10px; font-weight: 600; fill: #475569; }
      .label { font-size: 9.5px; font-weight: 500; }
      .label-bold { font-size: 9.5px; font-weight: 700; }
      .tick { font-size: 8.5px; fill: #475569; }
      .small { font-size: 8.2px; fill: #475569; }
      .badge { font-size: 8.5px; font-weight: 700; }
    </style>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#0072B2" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#B91C1C" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#009E73" />
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="368" fill="#FFFFFF" />

  <!-- Header -->
  <text x="360" y="18" text-anchor="middle" class="title" style="font-size:12.5px">White-Box Composable Skill Graph &amp; Defect Knowledge Graph Closed-Loop Architecture</text>
  <line x1="18" y1="25" x2="702" y2="25" stroke="#E2E8F0" stroke-width="1" />

  <!-- Stage 1: Commit Input -->
    <rect x="18" y="46" width="136" height="84" rx="6" ry="6" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4" />
  <text x="27" y="64" class="label-bold" style="font-size:10px;fill:#0F172A">1. Code Change</text>
  <text x="27" y="79" class="small" style="font-size:8.4px;fill:#475569">Git diff + source tree</text>
  <text x="27" y="92" class="small" style="font-size:8.4px;fill:#475569">(React/Express/GraphQL</text>
  <text x="27" y="105" class="small" style="font-size:8.4px;fill:#475569">or Django/HTMX)</text>
  <text x="27" y="118" class="small" style="font-size:8.4px;fill:#475569">No-impact files filtered</text>

  <!-- Stage 2: Grounder & Defect-Aware Selector -->
    <rect x="176" y="46" width="172" height="84" rx="6" ry="6" fill="#DBEAFE" stroke="#0072B2" stroke-width="1.4" />
  <rect x="296" y="52" width="46" height="15" rx="3" fill="#0072B2" />
  <text x="319" y="62.5" text-anchor="middle" class="badge" style="fill:#FFFFFF;font-size:7.6px">0-LLM</text>
  <text x="185" y="64" class="label-bold" style="font-size:10px;fill:#0F172A">2. Impact Selector</text>
  <text x="185" y="79" class="small" style="font-size:8.4px;fill:#475569">Static AST/URL grounder</text>
  <text x="185" y="92" class="small" style="font-size:8.4px;fill:#475569">Diff overlap + graph risk</text>
  <text x="185" y="105" class="small" style="font-size:8.4px;fill:#475569">Sibling defect propagation</text>
  <text x="185" y="118" class="small" style="font-size:8.4px;fill:#475569">Median 0.17-0.21 ms/commit</text>

  <!-- Stage 3: Composable Executor + Telemetry Oracle -->
    <rect x="176" y="154" width="172" height="98" rx="6" ry="6" fill="#F8FAFC" stroke="#334155" stroke-width="1.4" />
  <rect x="296" y="160" width="46" height="15" rx="3" fill="#334155" />
  <text x="319" y="170.5" text-anchor="middle" class="badge" style="fill:#FFFFFF;font-size:7.6px">0-LLM</text>
  <text x="185" y="172" class="label-bold" style="font-size:10px;fill:#0F172A">3. Skill Executor</text>
  <text x="185" y="187" class="small" style="font-size:8.4px;fill:#475569">Precondition DAG planner</text>
  <text x="185" y="200" class="small" style="font-size:8.4px;fill:#475569">Playwright semantic replay</text>
  <text x="185" y="213" class="small" style="font-size:8.4px;fill:#475569">Telemetry &amp; Oracle Gate:</text>
  <text x="185" y="226" class="small" style="font-size:8.4px;fill:#475569">  HTTP 5xx | JS pageerror</text>
  <text x="185" y="239" class="small" style="font-size:8.4px;fill:#475569">  DOM / API postconditions</text>

  <!-- Branch A: SKILL_DRIFT -> White-Box Self-Healer -->
    <rect x="396" y="46" width="306" height="92" rx="6" ry="6" fill="#D1FAE5" stroke="#009E73" stroke-width="1.4" />
  <rect x="626.8" y="52" width="69.2" height="15" rx="3" fill="#009E73" />
  <text x="661.4" y="62.5" text-anchor="middle" class="badge" style="fill:#FFFFFF;font-size:7.6px">Bounded LLM</text>
  <text x="405" y="64" class="label-bold" style="font-size:10px;fill:#0F172A">4A. SKILL_DRIFT: White-Box Self-Healer</text>
  <text x="405" y="79" class="small" style="font-size:8.4px;fill:#475569">Trigger: Locator missing AND 0 HTTP 5xx / 0 pageerror</text>
  <text x="405" y="92" class="small" style="font-size:8.4px;fill:#475569">Input: Scoped git diff + semantic DOM (no postcond edit)</text>
  <text x="405" y="105" class="small" style="font-size:8.4px;fill:#475569">Bounded k &lt;= 2 verifier-feedback retry loop</text>
  <text x="405" y="118" class="small" style="font-size:8.4px;fill:#475569">Gate: JSON Schema + live 0-LLM replay -&gt; Patched Skill</text>

  <!-- Branch B: PRODUCT_BUG -> Hard 0-LLM Refusal + DRAFT Emitter -->
    <rect x="396" y="156" width="306" height="96" rx="6" ry="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.4" />
  <rect x="632" y="162" width="64" height="15" rx="3" fill="#B91C1C" />
  <text x="664" y="172.5" text-anchor="middle" class="badge" style="fill:#FFFFFF;font-size:7.6px">0-LLM SAFE</text>
  <text x="405" y="174" class="label-bold" style="font-size:10px;fill:#0F172A">4B. PRODUCT_BUG: Refusal &amp; Draft Emitter</text>
  <text x="405" y="189" class="small" style="font-size:8.4px;fill:#475569">Trigger: HTTP 5xx, JS crash, or postcondition failure</text>
  <text x="405" y="202" class="small" style="font-size:8.4px;fill:#475569">Invariant: 0 LLM calls, 0% False Healing / Weakening</text>
  <text x="405" y="215" class="small" style="font-size:8.4px;fill:#475569">Auto-emits schema-valid DRAFT Bug + PROPOSED Guardrail</text>
  <text x="405" y="228" class="small" style="font-size:8.4px;fill:#475569">Human review strictly required before CONFIRMED</text>

  <!-- Stage 5: Unified Knowledge Graph & Local MCP Server -->
    <rect x="18" y="278" width="684" height="74" rx="6" ry="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4" />
  <rect x="626.8" y="284" width="69.2" height="15" rx="3" fill="#D97706" />
  <text x="661.4" y="294.5" text-anchor="middle" class="badge" style="fill:#FFFFFF;font-size:7.6px">CLOSED LOOP</text>
  <text x="27" y="296" class="label-bold" style="font-size:10px;fill:#0F172A">5. Unified Defect Knowledge Graph (build/knowledge-index.json) &amp; Local MCP Server (stdio)</text>
  <text x="27" y="311" class="small" style="font-size:8.4px;fill:#475569">Deterministic graph compiler: CONFIRMED bugs/invariants/guardrails strictly isolated from observed DRAFT records</text>
  <text x="27" y="324" class="small" style="font-size:8.4px;fill:#475569">Zero-dependency MCP JSON-RPC 2.0 server: 6 tools (query_defect_knowledge, plan_impacted_skills, compose_skill_plan,</text>
  <text x="27" y="337" class="small" style="font-size:8.4px;fill:#475569">ground_code_refs, run_skill_verification, emit_defect_draft) + 2 resources serving IDE coding agents at 0-LLM</text>

  <!-- Arrows -->
  <!-- 1 -> 2 -->
  <line x1="154" y1="88" x2="174" y2="88" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow-dark)" />
  <!-- 2 -> 3 -->
  <line x1="262" y1="130" x2="262" y2="152" stroke="#0072B2" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="268" y="145" class="small" style="fill:#0072B2;font-weight:600">Risk-ordered skills</text>

  <!-- 3 -> 4A (SKILL_DRIFT) -->
  <path d="M 348 182 L 372 182 L 372 92 L 394 92" fill="none" stroke="#009E73" stroke-width="1.6" marker-end="url(#arrow-teal)" />
  <rect x="353" y="114" width="38" height="14" rx="2" fill="#FFFFFF" />
  <text x="372" y="124" text-anchor="middle" class="badge" style="fill:#009E73;font-size:7.6px">DRIFT</text>

  <!-- 3 -> 4B (PRODUCT_BUG) -->
  <line x1="348" y1="208" x2="394" y2="208" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#arrow-red)" />
  <text x="371" y="201" text-anchor="middle" class="badge" style="fill:#B91C1C;font-size:7.6px">BUG</text>

  <!-- 4B -> 5 (DRAFT YAML emission) -->
  <line x1="549" y1="252" x2="549" y2="276" stroke="#B91C1C" stroke-width="1.6" marker-end="url(#arrow-red)" />
  <text x="556" y="268" class="small" style="fill:#B91C1C;font-weight:600">DRAFT Bug YAML (observed)</text>

  <!-- 4A -> 3 feedback (Verified patched skill) -->
  <path d="M 549 46 L 549 34 L 262 34 L 262 44" fill="none" stroke="#009E73" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow-teal)" />
  <rect x="352" y="27" width="126" height="12" rx="2" fill="#FFFFFF" />
  <text x="415" y="36" text-anchor="middle" class="small" style="fill:#009E73;font-size:7.8px;font-weight:600">Verified patched skill YAML</text>

  <!-- 5 -> 2 Closed feedback loop (Risk signals & Guardrails) -->
  <path d="M 86 278 L 86 196 L 164 196 L 164 114 L 174 114" fill="none" stroke="#D97706" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="26" y="182" class="small" style="fill:#D97706;font-weight:700">Risk scores,</text>
  <text x="26" y="193" class="small" style="fill:#D97706;font-weight:700">guardrails &amp;</text>
  <text x="26" y="204" class="small" style="fill:#D97706;font-weight:700">sibling links</text>

</svg>
